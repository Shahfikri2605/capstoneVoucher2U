<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create an Account</title>
    <link rel="stylesheet" href="../css/RegisterPage.css">
</head>
<body>

<div class="register-container">
    <div class="register-box">
        <div class="image-container">
        </div> <!-- The image is now a CSS background -->
        <div class="register-form">
            <h2>Create an Account</h2>
            <p>Set up your account</p>
            <form action="#" id="registrationForm">
                <div class="form-group">
                    <input type="text" placeholder="Name" name="name" required>
                </div>
                <input type="email" placeholder="Email Address" name="email" required>
                <div class="form-group">
                    <input type="text" placeholder="Credit/Debit Card Number" name="cardNumber">
                    <input type="text" placeholder="Bank Account Number" name="bankAccNum">
                </div>
                <div class="radio-buttons">
                    <input type="radio" id="credit" name="account-type" checked>
                    <label for="credit">Credit/Debit Card Number</label>
                    <input type="radio" id="bank" name="account-type">
                    <label for="bank">Bank Account Number</label>
                </div>
                <div class="form-group">
                    <input type="password" placeholder="Password" name="password" required>
                    <input type="password" placeholder="Confirm Password" id="confirmPassword" required>
                </div>
                <div class="buttons">
                    <button type="submit">Continue</button>
                    <button type="button" class="cancel">Cancel</button>
                </div>
            </form>
            <p class="login-link">Already have an account? <a href="LoginPage.html">Login here</a></p>
            <div id="message"></div>
        </div>
    </div>
</div>
    <script src="../js/userRegister.js"></script>
</body>
</html>
